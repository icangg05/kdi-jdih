name: jdih_kendari
description: Aplikasi mobile JDIH Kota Kendari (frontend publik).
publish_to: "none"
# versionCode > 4: app versi pertama (mobile-jdih) sudah rilis di 1.0.0+4
version: 1.1.0+5

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cached_network_image: ^4.0.4
  flutter_widget_from_html_core: ^0.17.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.0
  intl: any
  pdfrx: ^2.4.7
  youtube_player_iframe: ^6.0.2
  file_saver: ^0.6.0
  skeletonizer: ^3.0.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Logo sama dengan app lama (mobile-jdih/assets/icon/jdihkendari.png), diambil
# dari salinan resolusi tinggi public/assets/img/logo-new-jdih.png. icon_fg &
# splash: logo selebar 600px di kanvas 1024 = di dalam zona aman ikon adaptif.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_fg.png

# Slate-50 = kanvas app (C.lightBg). Terang juga di mode gelap: app dikunci
# tema terang, dan tulisan biru logo tenggelam di latar gelap.
flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#F8FAFC"
  image: assets/icon/splash.png
  android_12:
    color: "#F8FAFC"
    color_dark: "#F8FAFC"
    image: assets/icon/splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-SourceSerif4.txt
  # Source Sans 3 (sama dengan web) untuk UI, Source Serif 4 untuk teks bacaan.
  # Dibundel agar tetap tampil offline. Statis, bukan variable font: FontWeight
  # Flutter tidak menggerakkan sumbu wght.
  fonts:
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-It.ttf
          style: italic
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-BoldIt.ttf
          weight: 700
          style: italic

