services:
  app:
    container_name: jdihkendari-kominfo
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "6992:8000"
    environment:
      APP_ENV: local # overrides .env (Dotenv won't override an already-set var)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: jdihkendarikota
      DB_USERNAME: jdihkendari
      DB_PASSWORD: m67iEudLY25AXUm21UEMN
      # Sesi/login di localhost: .env produksi memakai domain .kendarikota.go.id +
      # secure-only, sehingga cookie sesi tak tersimpan di http://localhost -> CSRF
      # gagal ("page expired"). Kosongkan domain & matikan secure untuk dev.
      SESSION_DOMAIN: "" # host-only cookie (localhost)
      SESSION_SECURE_COOKIE: "false" # izinkan cookie di http (non-HTTPS)
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy # tunggu dump 2.8MB selesai diimpor

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: jdihkendarikota
      MYSQL_USER: jdihkendari
      MYSQL_PASSWORD: m67iEudLY25AXUm21UEMN
      MYSQL_ROOT_PASSWORD: m67iEudLY25AXUm21UEMN
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-import saat volume masih kosong. Hapus volume untuk re-seed.
      - ./jdihkendarikota.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 256M
    ports:
      - "8091:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
